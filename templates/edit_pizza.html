<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdminLTE v4 | Edit Pizza</title>

    <!-- Bootstrap Icons & AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/adminlte.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script>
      (() => {
        'use strict';
        const STORAGE_KEY = 'lte-theme';
        let stored = localStorage.getItem(STORAGE_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let resolved = stored;
        if (resolved !== 'dark' && resolved !== 'light') {
          resolved = prefersDark ? 'dark' : 'light';
        }
        document.documentElement.dataset.bsTheme = resolved;
      })();
    </script>
  </head>

  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">

      <!-- Header -->
      <nav class="app-header navbar navbar-expand bg-body" aria-label="Main Header Navigation">
        <div class="container-fluid">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" data-lte-toggle="sidebar" href="#"><i class="bi bi-list"></i></a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Sidebar -->
      <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
          <a href="/" class="brand-link">
            <span class="brand-text fw-light"> 🍕 Our pizza </span>
          </a>
        </div>
        <div class="sidebar-wrapper">
          <nav class="mt-2" aria-label="Sidebar Navigation">
            <ul class="nav sidebar-menu flex-column">
              <li class="nav-item">
<a href="{{ url_for('dashboard') }}" class="nav-link">
                    <i class="nav-icon bi bi-speedometer"></i>
                  <p>Dashboard 📊</p>
                </a>
              </li>
              <li class="nav-item">
<a href="{{ url_for('dashboard') }}#pizza-list" class="nav-link active">  
                    <i class="nav-icon bi bi-circle"></i>
                  <p>Pizza List 🍕</p>
                </a>
              </li>
              <li class="nav-item">
<a href="{{ url_for('dashboard') }}#reviews" class="nav-link">
                    <i class="nav-icon bi bi-star"></i>
                  <p>View Reviews 👨🏻💻</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="app-main">
        <div class="app-content-header">
          <div class="container-fluid">
            <div class="row">
              <div class="col-sm-6">
                <h2 class="mb-0 fs-3">Edit Pizza 🍕</h2>
              </div>
              <div class="col-sm-6">
                <nav aria-label="breadcrumb">
                  <ol class="breadcrumb float-sm-end">
                    <li class="breadcrumb-item"><a href="/">Home</a></li>
                    <li class="breadcrumb-item active">Edit Pizza</li>
                  </ol>
                </nav>
              </div>
            </div>
          </div>
        </div>

        <div class="app-content">
          <div class="container-fluid">
            <div class="row justify-content-center">
              <div class="col-md-8">
                <div class="card card-warning">
                  <div class="card-header">
                    <h3 class="card-title mb-0">Edit Pizza Details</h3>
                  </div>
                  <form action="{{ url_for('editpizza', id=pizza[0]) }}" method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="card-body">
                      <div class="mb-3">
                        <label for="pizza_name" class="form-label fw-bold">Pizza Name</label>
                        <input id="pizza_name" type="text" name="name" class="form-control" value="{{ pizza[1] }}" required>
                      </div>
                      <div class="mb-3">
                        <label for="pizza_description" class="form-label fw-bold">Description</label>
                        <textarea id="pizza_description" name="description" class="form-control" rows="3">{{ pizza[2] }}</textarea>
                      </div>
                      <div class="mb-3">
                        <label for="pizza_price" class="form-label fw-bold">Price (₹)</label>
                        <input id="pizza_price" type="text" pattern="[0-9]+" name="price" class="form-control" value="{{ pizza[3] }}" required>
                      </div>
                      <div class="mb-3">
                        <label for="pizza_image" class="form-label fw-bold">Image / Photo (Optional)</label>
                        <input id="pizza_image" type="file" name="image" class="form-control" accept="image/*">
                        {% if pizza[4] %}
                        <div class="mt-2">
                          <small class="text-muted">Current Image: {{ pizza[4] }}</small><br>
                          <img src="{{ url_for('static', filename='images/' ~ pizza[4]) }}" style="width: 80px; height: 60px; object-fit: cover; border-radius: 6px;" class="mt-1" alt="Current Pizza">
                        </div>
                        {% endif %}
                      </div>
                    </div>
                    <div class="card-footer d-flex justify-content-between">
<a href="{{ url_for('dashboard') }}#pizza-list" class="btn btn-secondary">Cancel</a>                     
 <button type="submit" class="btn btn-warning fw-bold"><i class="bi bi-check-circle me-1"></i> Update Pizza</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="app-footer">
        <div class="float-end d-none d-sm-inline">Anything you want</div>
        <strong>Copyright &copy; 2014-2026 AdminLTE.io.</strong> All rights reserved.
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/adminlte.js') }}"></script>
  </body>
</html>
