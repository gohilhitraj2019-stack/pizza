<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdminLTE v4 | Edit Review</title>

    <!-- Bootstrap Icons & AdminLTE CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/adminlte.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script>
      (() => {
        'use strict';
        const STORAGE_KEY = 'lte-theme';
        let stored = localStorage.getItem(STORAGE_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let resolved = (stored === 'dark' || stored === 'light') ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', resolved);
      })();
    </script>
  </head>

  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">

      <!-- Header -->
      <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" data-lte-toggle="sidebar" href="#"><i class="bi bi-list"></i></a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Sidebar -->
      <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
          <a href="/" class="brand-link">
            <span class="brand-text fw-light"> 🍕 Our pizza </span>
          </a>
        </div>
        <div class="sidebar-wrapper">
          <nav class="mt-2">
            <ul class="nav sidebar-menu flex-column">
              <li class="nav-item">
                <a href="{{ url_for('home') }}" class="nav-link">
                  <i class="nav-icon bi bi-speedometer"></i>
                  <p>Dashboard 📊</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="{{ url_for('home') }}#pizza-list" class="nav-link">
                  <i class="nav-icon bi bi-circle"></i>
                  <p>Pizza List 🍕</p>
                </a>
              </li>
              <li class="nav-item">
                <a href="{{ url_for('home') }}#reviews" class="nav-link active">
                  <i class="nav-icon bi bi-star"></i>
                  <p>View Reviews 👨🏻💻</p>
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="app-main">
        <div class="app-content-header">
          <div class="container-fluid">
            <div class="row">
              <div class="col-sm-6">
                <h2 class="mb-0 fs-3">Edit Review ⭐</h2>
              </div>
              <div class="col-sm-6">
                <nav aria-label="breadcrumb">
                  <ol class="breadcrumb float-sm-end">
                    <li class="breadcrumb-item"><a href="/">Home</a></li>
                    <li class="breadcrumb-item active">Edit Review</li>
                  </ol>
                </nav>
              </div>
            </div>
          </div>
        </div>

        <div class="app-content">
          <div class="container-fluid">
            <div class="row justify-content-center">
              <div class="col-md-8">
                <div class="card card-warning">
                  <div class="card-header">
                    <h3 class="card-title mb-0">Edit Customer Review</h3>
                  </div>
                  <form action="{{ url_for('editreview', id=review[0]) }}" method="POST" enctype="multipart/form-data">
                    <div class="card-body">
                      <div class="mb-3">
                        <label class="form-label fw-bold">Customer Name</label>
                        <input type="text" name="customer_name" class="form-control" value="{{ review[1] }}" required>
                      </div>
                      <div class="mb-3">
                        <label class="form-label fw-bold">Rating (1 to 5)</label>
                        <select name="rating" class="form-select" required>
                          <option value="5" {% if review[3] == 5 %}selected{% endif %}>5 ⭐⭐⭐⭐⭐ (Excellent)</option>
                          <option value="4" {% if review[3] == 4 %}selected{% endif %}>4 ⭐⭐⭐⭐ (Very Good)</option>
                          <option value="3" {% if review[3] == 3 %}selected{% endif %}>3 ⭐⭐⭐ (Good)</option>
                          <option value="2" {% if review[3] == 2 %}selected{% endif %}>2 ⭐⭐ (Fair)</option>
                          <option value="1" {% if review[3] == 1 %}selected{% endif %}>1 ⭐ (Poor)</option>
                        </select>
                      </div>
                      <div class="mb-3">
                        <label class="form-label fw-bold">Review Message</label>
                        <textarea name="review" class="form-control" rows="3" required>{{ review[4] }}</textarea>
                      </div>
                      <div class="mb-3">
                        <label class="form-label fw-bold">Customer Photo (Optional)</label>
                        <input type="file" name="image" class="form-control" accept="image/*">
                        {% if review[2] %}
                        <div class="mt-2">
                          <small class="text-muted">Current Photo: {{ review[2] }}</small><br>
                          <img src="{{ url_for('static', filename='images/' ~ review[2]) }}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 50%;" class="mt-1">
                        </div>
                        {% endif %}
                      </div>
                    </div>
                    <div class="card-footer d-flex justify-content-between">
                      <a href="{{ url_for('dashboard') }}#reviews" class="btn btn-secondary">Cancel</a>
                      <button type="submit" class="btn btn-warning fw-bold"><i class="bi bi-check-circle me-1"></i> Update Review</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="app-footer">
        <div class="float-end d-none d-sm-inline">Anything you want</div>
        <strong>Copyright &copy; 2014-2026 AdminLTE.io.</strong> All rights reserved.
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/adminlte.js') }}"></script>
  </body>
</html>
