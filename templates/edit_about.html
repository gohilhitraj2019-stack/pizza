<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Edit About Section</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4">Edit About Our Pizza</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="3" required>{{ about[1] }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Years Experience</label>
            <input type="text" class="form-control" name="years_experience" value="{{ about[2] }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Happy Customers</label>
            <input type="text" class="form-control" name="happy_customers" value="{{ about[3] }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Pizza Recipes</label>
            <input type="text" class="form-control" name="pizza_recipes" value="{{ about[4] }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Fast Delivery</label>
            <input type="text" class="form-control" name="fast_delivery" value="{{ about[5] }}" required>
        </div>

        <button type="submit" class="btn btn-danger">Save Changes</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>

    </form>
</div>

</body>
</html>
