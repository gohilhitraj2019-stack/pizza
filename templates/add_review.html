<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h2>Add Customer Review</h2>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label for="customer_name">Customer Name</label>
                    <input type="text"
                           id="customer_name"
                           name="customer_name"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label for="image">Image Name</label>
                    <input type="text"
                           id="image"
                           name="image"
                           class="form-control"
                           placeholder="example.jpg"
                           required>
                </div>

                <div class="mb-3">
                    <label for="rating">Rating (1-5)</label>
                    <input type="number"
                           id="rating"
                           name="rating"
                           min="1"
                           max="5"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label for="review">Review</label>
                    <textarea
                        id="review"
                        name="review"
                        class="form-control"
                        rows="4"
                        required></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Add Review
                </button>

                <a href="/reviews" class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
